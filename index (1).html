<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ainhoa vintage · stock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap');

:root {
  --cream: #f7f3ee;
  --warm-white: #fdfaf6;
  --charcoal: #1e1b18;
  --charcoal-light: #2e2a26;
  --terracotta: #a0522d;
  --terracotta-light: #c4784a;
  --border: #ddd5c8;
  --muted: #8a7d72;
  --green: #3a6b52;
  --red: #8b2a2a;
  --amber: #8b6914;
  --tag-bg: #ede5d8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--cream);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  color: var(--charcoal);
}

/* ─── HEADER ─── */
header {
  background: var(--charcoal);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  border-bottom: 2px solid var(--terracotta);
}

.logo-img {
  height: 36px;
  width: auto;
  filter: invert(1) brightness(1.1);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.vintage-tag {
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #9a8a7a;
}

.reload-btn {
  background: none;
  border: 1px solid #4a3f36;
  border-radius: 2px;
  color: #9a8a7a;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.reload-btn:hover { border-color: var(--terracotta-light); color: #d4a882; }
.reload-btn.loading { color: var(--terracotta-light); border-color: var(--terracotta-light); animation: spin-dot 1s infinite; }
.reload-btn.ok { color: #7fcfa0; border-color: #3a6b52; }
.reload-btn.err { color: #e07070; border-color: var(--red); }

@keyframes spin-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ─── MAIN ─── */
.main {
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 16px 48px;
}

/* ─── TABS ─── */
.tabs {
  display: flex;
  margin-bottom: 20px;
  border: 1.5px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  background: var(--warm-white);
}

.tab {
  flex: 1;
  padding: 12px;
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.tab + .tab { border-left: 1.5px solid var(--border); }
.tab.active { background: var(--charcoal); color: var(--cream); }

/* ─── PANEL ─── */
.panel { display: none; }
.panel.active { display: block; }

/* ─── SEARCH BOX ─── */
.search-box {
  background: var(--warm-white);
  border: 1.5px solid var(--border);
  border-radius: 3px;
  padding: 18px;
  margin-bottom: 16px;
}

.field-label {
  display: block;
  font-size: 0.58rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.input-row { display: flex; gap: 8px; }

textarea, input[type="text"] {
  background: var(--cream);
  border: 1.5px solid var(--border);
  border-radius: 2px;
  padding: 10px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 0.88rem;
  color: var(--charcoal);
  transition: border-color 0.15s;
  outline: none;
}
textarea { flex: 1; resize: vertical; min-height: 64px; line-height: 1.6; }
input[type="text"] { flex: 1; }
textarea:focus, input[type="text"]:focus { border-color: var(--terracotta); }
textarea::placeholder, input[type="text"]::placeholder { color: var(--muted); font-style: italic; font-size: 0.78rem; }

.btn {
  background: var(--terracotta);
  color: #fff;
  border: none;
  border-radius: 2px;
  padding: 10px 16px;
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
  align-self: stretch;
}
.btn:hover { background: var(--terracotta-light); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.hint {
  font-size: 0.58rem;
  color: var(--muted);
  margin-top: 7px;
  line-height: 1.6;
  letter-spacing: 0.02em;
}

/* ─── PHOTO BOX ─── */
.photo-box {
  background: var(--warm-white);
  border: 1.5px solid var(--border);
  border-radius: 3px;
  padding: 18px;
  margin-bottom: 16px;
}

.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 3px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--terracotta);
  background: var(--tag-bg);
}
.drop-zone .icon { font-size: 1.8rem; margin-bottom: 10px; }
.drop-zone p { font-size: 0.76rem; color: var(--muted); line-height: 1.7; }
.drop-zone strong { color: var(--terracotta); }

input[type="file"] { display: none; }

#previewWrap {
  margin-top: 12px;
  position: relative;
  display: none;
}
#previewImg {
  width: 100%;
  max-height: 200px;
  object-fit: contain;
  border-radius: 3px;
  border: 1.5px solid var(--border);
  background: var(--cream);
}
.clear-photo {
  position: absolute;
  top: 6px; right: 6px;
  background: rgba(30,27,24,0.75);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 24px; height: 24px;
  font-size: 0.65rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.photo-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.btn-outline {
  flex: 1;
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 2px;
  padding: 10px;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  color: var(--charcoal);
  transition: border-color 0.15s;
  text-align: center;
}
.btn-outline:hover { border-color: var(--terracotta); }

/* ─── MANUAL ENTRY ─── */
#manualEntry {
  display: none;
  margin-top: 14px;
}

/* ─── RESULTS ─── */
.results { display: flex; flex-direction: column; gap: 10px; }

.card {
  background: var(--warm-white);
  border: 1.5px solid var(--border);
  border-radius: 3px;
  padding: 16px 18px;
  animation: fadeIn 0.18s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; } }

.card.found  { border-left: 4px solid var(--green); }
.card.no-price { border-left: 4px solid var(--amber); }
.card.not-found { border-left: 4px solid var(--red); }
.card.ambiguous { border-left: 4px solid var(--amber); }

.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.found .status-dot { background: var(--green); }
.no-price .status-dot { background: var(--amber); }
.not-found .status-dot { background: var(--red); }
.ambiguous .status-dot { background: var(--amber); }

.code-tag {
  background: var(--tag-bg);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 8px;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  font-family: 'DM Mono', monospace;
}

.product-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  font-style: italic;
  line-height: 1.35;
  margin-bottom: 8px;
  font-weight: 300;
}

.price-row { display: flex; align-items: baseline; gap: 10px; }
.price-label { font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.price-value { font-size: 1.3rem; font-weight: 400; color: var(--green); font-family: 'Cormorant Garamond', serif; }

.err-msg { font-size: 0.78rem; color: var(--red); margin-bottom: 5px; }

.similar-list { margin-top: 8px; }
.similar-label { font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.similar-item {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 8px 10px;
  margin-bottom: 4px;
  font-size: 0.76rem;
  cursor: pointer;
  transition: border-color 0.12s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.similar-item:hover { border-color: var(--terracotta); }
.similar-item .si-price { color: var(--muted); font-size: 0.68rem; margin-left: auto; }

.amb-option {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 9px 12px;
  margin-bottom: 5px;
}
.amb-code { font-weight: 500; margin-bottom: 2px; font-size: 0.82rem; }
.amb-price { color: var(--green); }
.amb-price-na { color: var(--muted); font-style: italic; font-size: 0.76rem; }
.amb-q { font-size: 0.68rem; color: var(--muted); margin-top: 8px; }

/* ─── FOOTER ─── */
footer {
  text-align: center;
  padding: 28px 16px;
  font-size: 0.55rem;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-top: 1px solid var(--border);
  margin-top: 24px;
}
</style>
</head>

const PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://cors-anywhere.herokuapp.com/'
];

let stockData = [];

// ── STOCK LOAD ──────────────────────────────
async function reloadStock() {
  const btn = document.getElementById('reloadBtn');
  btn.textContent = '⟳ cargando...';
  btn.className = 'reload-btn loading';

  for (const proxy of PROXIES) {
    try {
      const url = proxy + encodeURIComponent(SHEETS_URL);
      const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const text = await res.text();
      if (text.length < 100) continue;
      const parsed = parseCSV(text);
      if (parsed.length === 0) continue;
      stockData = parsed;
      btn.textContent = '✓ ' + parsed.length + ' prendas';
      btn.className = 'reload-btn ok';
      return;
    } catch(e) { /* try next */ }
  }

  // último intento: directo
  try {
    const res = await fetch(SHEETS_URL, { signal: AbortSignal.timeout(6000) });
    const text = await res.text();
    const parsed = parseCSV(text);
    if (parsed.length > 0) {
      stockData = parsed;
      btn.textContent = '✓ ' + parsed.length + ' prendas';
      btn.className = 'reload-btn ok';
      return;
    }
  } catch(e) {}

  btn.textContent = '✗ sin conexión — recargá';
  btn.className = 'reload-btn err';
}

function parseCSV(text) {
  const lines = text.split('\n');
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (!cols || cols.length < 14) continue;
    const cp = parseInt(cols[0], 10);
    const np = String(cols[2] || '').replace(/\.0$/, '').trim();
    if (isNaN(cp) || !np) continue;
    const prod = String(cols[6] || '').trim();
    if (!prod) continue;
    const pv = cols[13] ? parseInt(String(cols[13]).replace(/[^0-9]/g, ''), 10) : null;
    result.push({ c: cp + '-' + np, p: prod, v: isNaN(pv) ? null : pv });
  }
  return result;
}

function parseCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  result.push(cur.trim());
  return result;
}

// ── NORMALIZE CODE ──────────────────────────
function normalizeCode(raw) {
  let s = raw.trim().toUpperCase().replace(/^AIN[-\s]*/i, '');
  s = s.replace(/\s+/g, '').replace(/[\/\\]/g, '-').replace(/-+$/, '');
  const parts = s.split('-');
  if (parts.length >= 2) {
    const a = parseInt(parts[0], 10), b = parseInt(parts[1], 10);
    if (!isNaN(a) && !isNaN(b)) return a + '-' + b;
  }
  return s.toLowerCase();
}

function findItems(raw) {
  const n = normalizeCode(raw);
  return stockData.filter(item => item.c.toLowerCase() === n);
}

function findSimilar(raw) {
  const n = normalizeCode(raw);
  const prov = n.split('-')[0];
  const same = stockData.filter(i => i.c.startsWith(prov + '-') && i.p);
  const other = stockData.filter(i => !i.c.startsWith(prov + '-') && i.p);
  function sc(a, b) {
    let k = 0, l = Math.min(a.length, b.length);
    for (let i = 0; i < l; i++) if (a[i] === b[i]) k++;
    return k / Math.max(a.length, b.length);
  }
  return [...same, ...other].map(i => ({ i, s: sc(i.c, n) }))
    .sort((a, b) => b.s - a.s).slice(0, 5).map(x => x.i);
}

// ── RENDER ──────────────────────────────────
function fmt(v) { return '$' + v.toLocaleString('es-AR'); }

function renderCard(raw) {
  if (!stockData.length) return '<div class="card not-found"><div class="card-top"><div class="status-dot"></div><span class="code-tag">' + raw + '</span></div><p class="err-msg">Stock no cargado. Tocá "recargar" arriba.</p></div>';

  const matches = findItems(raw);

  if (matches.length === 0) {
    const sim = findSimilar(raw);
    let h = '<div class="card not-found"><div class="card-top"><div class="status-dot"></div><span class="code-tag">' + raw.trim() + '</span></div><p class="err-msg">No encontré ese código.</p>';
    if (sim.length) {
      h += '<div class="similar-list"><p class="similar-label">Códigos similares</p>';
      sim.forEach(item => {
        const pr = item.v ? fmt(item.v) : '— sin precio';
        h += '<div class="similar-item" onclick="fillCode(\'' + item.c + \'')"><strong>' + item.c + '</strong> · ' + (item.p||'—') + '<span class="si-price">' + pr + '</span></div>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }

  if (matches.length > 1) {
    let h = '<div class="card ambiguous"><div class="card-top"><div class="status-dot"></div><span class="code-tag">' + raw.trim() + '</span><span style="font-size:0.68rem;color:var(--muted)">Varias coincidencias</span></div>';
    matches.forEach((item, i) => {
      const pr = item.v ? '<span class="amb-price">' + fmt(item.v) + '</span>' : '<span class="amb-price-na">Sin precio</span>';
      h += '<div class="amb-option"><div class="amb-code">' + (i+1) + '. ' + item.c + '</div><div style="font-size:0.82rem;margin-bottom:3px">' + (item.p||'—') + '</div>' + pr + '</div>';
    });
    h += '<p class="amb-q">¿Cuál querés consultar?</p></div>';
    return h;
  }

  const item = matches[0];
  if (!item.v) return '<div class="card no-price"><div class="card-top"><div class="status-dot"></div><span class="code-tag">' + item.c + '</span></div><p class="product-name">' + item.p + '</p><p style="font-size:0.76rem;color:var(--muted);font-style:italic">Sin precio asignado — revisá el estado en la planilla.</p></div>';

  return '<div class="card found"><div class="card-top"><div class="status-dot"></div><span class="code-tag">' + item.c + '</span></div><p class="product-name">' + item.p + '</p><div class="price-row"><span class="price-label">Precio de venta</span><span class="price-value">' + fmt(item.v) + '</span></div></div>';
}

// ── SEARCH CODE ─────────────────────────────
function searchByCode() {
  const raw = document.getElementById('queryInput').value.trim();
  if (!raw) return;
  const qs = raw.split('\n').map(s => s.trim()).filter(Boolean);
  document.getElementById('results-code').innerHTML = qs.map(renderCard).join('');
}

function fillCode(code) {
  switchTab('code');
  document.getElementById('queryInput').value = code;
  searchByCode();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('queryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); searchByCode(); }
  });
});

// ── PHOTO ────────────────────────────────────
const dropZone = document.getElementById('dropZone');
const photoInput = document.getElementById('photoInput');

dropZone.addEventListener('click', () => photoInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) loadPhoto(e.dataTransfer.files[0]); });
photoInput.addEventListener('change', () => { if (photoInput.files[0]) loadPhoto(photoInput.files[0]); });

function loadPhoto(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('previewWrap').style.display = 'block';
    document.getElementById('photoActions').style.display = 'flex';
    document.getElementById('manualEntry').style.display = 'block';
    dropZone.style.display = 'none';
    document.getElementById('results-photo').innerHTML = '';
    setTimeout(() => document.getElementById('photoCodeInput').focus(), 150);
  };
  reader.readAsDataURL(file);
}

function clearPhoto() {
  photoInput.value = '';
  document.getElementById('previewImg').src = '';
  document.getElementById('previewWrap').style.display = 'none';
  document.getElementById('photoActions').style.display = 'none';
  document.getElementById('manualEntry').style.display = 'none';
  document.getElementById('photoCodeInput').value = '';
  dropZone.style.display = 'block';
  document.getElementById('results-photo').innerHTML = '';
}

function searchFromPhoto() {
  const code = document.getElementById('photoCodeInput').value.trim();
  if (!code) return;
  document.getElementById('results-photo').innerHTML = renderCard(code);
}

// ── TABS ─────────────────────────────────────
function switchTab(name) {
  ['code','photo'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('panel-'+t).classList.toggle('active', t===name);
  });
}

// ── INIT ─────────────────────────────────────
reloadStock();
</script>
